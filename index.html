<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0eee8;--s1:#fff;--s2:#f5f3ef;--s3:#ece9e3;
  --bd:#e0ddd6;--bd2:#d0cdc6;
  --t1:#1a1814;--t2:#6b6860;--t3:#a8a49c;
  --acc:#ff4d6d;--ora:#ff8c42;
  --grn:#00c896;--red:#ff4d6d;
  --pur:#7c5cfc;
}
html,body,#root{height:100%;background:var(--bg)}
body{font-family:'Noto Sans TC',sans-serif;color:var(--t1);max-width:480px;margin:0 auto}
.nav{display:flex;padding:10px 10px 8px;gap:4px;border-bottom:2px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:200}
.ntab{flex:1;text-align:center;font-size:.68rem;letter-spacing:.04em;color:var(--t3);padding:8px 2px;border-radius:10px;cursor:pointer;border:none;background:none;font-family:'Noto Sans TC',sans-serif;transition:all .2s;font-weight:700}
.ntab.on{color:#fff;background:var(--acc)}
.ntab .sn{display:block;font-family:'Space Mono',monospace;font-size:.55rem;opacity:.7;margin-bottom:2px;font-weight:400}
.pg{display:none;padding:14px 13px 60px}
.pg.on{display:block}
input[type=text],input[type=number]{background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;color:var(--t1);font-family:'Space Mono',monospace;font-size:.86rem;padding:0 10px;height:40px;outline:none;width:100%;transition:border-color .2s}
input:focus{border-color:var(--acc);background:#fff}
input::placeholder{color:var(--t3)}
.rm-btn{background:none;border:1px solid var(--bd2);color:var(--t3);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rm-btn:active{border-color:var(--red);color:var(--red)}
.sec{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;font-weight:700}
.ptog{display:inline-flex;background:var(--s3);border-radius:8px;padding:2px;gap:1px;flex-shrink:0}
.pb{font-size:.6rem;font-family:'Noto Sans TC',sans-serif;padding:3px 9px;border-radius:6px;border:none;background:none;color:var(--t3);cursor:pointer;transition:all .15s;font-weight:700}
.pb.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fbox{background:var(--s1);border-radius:14px;padding:13px;margin-bottom:14px;border:1.5px solid var(--bd)}
.frow{display:grid;grid-template-columns:1fr 86px 30px;gap:6px;margin-bottom:7px;align-items:center}
.add-row-btn{width:100%;background:none;border:1.5px dashed var(--bd2);color:var(--t3);height:33px;border-radius:9px;cursor:pointer;font-size:.73rem;font-family:'Noto Sans TC',sans-serif;font-weight:700}
.add-row-btn:active{border-color:var(--acc);color:var(--acc)}
.icard{background:var(--s1);border-radius:14px;padding:13px;margin-bottom:8px;border:1.5px solid var(--bd);cursor:grab}
.icard.dragging{opacity:.4}
.icard.drag-over{border-color:var(--acc)}
.icard-top{display:grid;grid-template-columns:1fr 30px;gap:7px;align-items:center;margin-bottom:9px}
.icard-top input{font-family:'Noto Sans TC',sans-serif;font-size:.9rem;font-weight:700}
.icard-fields{display:flex;flex-direction:column;gap:8px}
.fl{font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;min-height:17px;font-weight:700}
/* 階梯定價 */
.tier-row{display:grid;grid-template-columns:80px 1fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.tier-label{font-size:.65rem;color:var(--t3);font-family:'Space Mono',monospace;text-align:right;white-space:nowrap}
.tier-row2{display:grid;grid-template-columns:1fr auto 1.3fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.tier-u{font-size:.8rem;color:var(--t2);font-weight:700;white-space:nowrap}
.tier-preview{margin-top:8px;font-family:'Space Mono',monospace;font-size:.68rem;color:var(--grn);background:var(--s2);border-radius:8px;padding:6px 8px;line-height:1.7}
.add-tier-btn{background:none;border:1px dashed var(--bd2);color:var(--t3);height:30px;border-radius:7px;cursor:pointer;font-size:.7rem;font-family:'Noto Sans TC',sans-serif;width:100%;margin-top:2px}
.add-tier-btn:active{border-color:var(--grn);color:var(--grn)}
/* 快捷金額 */
.shortcut-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.sc-amt-tag{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-family:'Space Mono',monospace;font-size:.75rem}
.sc-amt-tag button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:.8rem;padding:0;line-height:1}
.sc-amt-tag button:active{color:var(--red)}
.add-sc-btn{background:none;border:1px dashed var(--bd2);color:var(--t3);height:28px;border-radius:6px;cursor:pointer;font-size:.7rem;font-family:'Noto Sans TC',sans-serif;padding:0 10px}
.add-sc-btn:active{border-color:var(--grn);color:var(--grn)}
.add-item-btn{width:100%;background:var(--s1);border:1.5px dashed var(--bd2);color:var(--t2);height:44px;border-radius:12px;cursor:pointer;font-size:.85rem;font-family:'Noto Sans TC',sans-serif;margin-bottom:11px;font-weight:700}
.add-item-btn:active{color:var(--acc)}
.saved-configs{background:var(--s1);border-radius:14px;overflow:hidden;margin-bottom:14px;border:1.5px solid var(--bd)}
.sc-row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--bd);cursor:pointer}
.sc-row:last-child{border-bottom:none}
.sc-date{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--t2);font-weight:700}
.sc-info{flex:1;font-size:.78rem}
.sc-load{font-size:.65rem;color:var(--acc);font-family:'Space Mono',monospace;font-weight:700}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--acc),var(--ora));color:#fff;border:none;border-radius:14px;height:52px;font-size:.92rem;font-weight:900;font-family:'Noto Sans TC',sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 16px rgba(255,77,109,.25);margin-top:4px}
.btn-primary:active{opacity:.88}
/* 收銀 */
.day-bar{display:flex;gap:8px;margin-bottom:13px}
.db{background:var(--s1);border-radius:14px;padding:11px 14px;border:1.5px solid var(--bd);flex:1}
.db-l{font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:2px;font-weight:700}
.db-v{font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700}
.db-v.g{color:var(--grn)}.db-v.r{color:var(--red)}
.tx-box{background:var(--s1);border-radius:14px;padding:13px;margin-bottom:11px;border:1.5px solid var(--bd)}
.tx-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tx-hd-l{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:900}
.tx-sub{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--t2)}
.done-btn{width:100%;background:linear-gradient(135deg,var(--pur),var(--acc));color:#fff;border:none;border-radius:12px;height:48px;font-size:.9rem;font-weight:900;font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-bottom:10px}
.done-btn:active{opacity:.85}
/* 格狀品項 - 字大4pt */
.picker{display:grid;grid-auto-flow:column;gap:6px}
.prow{background:var(--s2);border-radius:10px;padding:10px 8px;border:1.5px solid transparent;cursor:pointer;transition:all .15s;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.prow.sel{background:#fff5f7;border-color:var(--acc)}
.pname{font-size:1.05rem;font-weight:700;line-height:1.3;color:var(--t1)}
.prow.sel .pname{color:var(--acc)}
.prow-amt{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--t2);margin-top:3px}
.prow.sortmode{background:var(--s3);border-style:dashed;border-color:var(--bd2);cursor:grab;padding:10px 6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.prow.sortmode.src{opacity:.3}
.prow.sortmode.over{border-color:var(--acc);border-style:solid;background:#fff5f7}
.drag-ghost{position:fixed;transform:translate(-50%,-130%);background:var(--acc);color:#fff;padding:10px 16px;border-radius:12px;font-weight:900;font-size:1.05rem;pointer-events:none;z-index:600;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
/* 交易記錄 */
.rec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rec-l{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:700}
.rec-c{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--t3)}
.txcard{background:var(--s1);border-radius:12px;padding:11px 13px;display:flex;align-items:flex-start;gap:9px;margin-bottom:6px;border:1.5px solid var(--bd)}
.txn{font-family:'Space Mono',monospace;font-size:.66rem;color:var(--t3);padding-top:2px;min-width:22px;font-weight:700}
.txc{flex:1;min-width:0}
.txi{font-size:.81rem;color:var(--t2);line-height:1.6}
.txa{display:flex;gap:9px;margin-top:4px;align-items:center}
.txr{font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700;color:var(--t1)}
.txg{font-family:'Space Mono',monospace;font-size:.74rem;color:var(--grn);font-weight:700}
.txt2{font-size:.64rem;color:var(--t3);margin-left:auto}
.tx-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:.88rem;padding:2px 5px}
.tx-del:active{color:var(--red)}
.empty{background:var(--s1);border:1.5px dashed var(--bd2);border-radius:12px;padding:28px 16px;text-align:center;color:var(--t3);font-size:.82rem}
/* Modal - 全畫面 */
.modal-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;overflow-y:auto}
.modal{background:var(--bg);padding:20px 18px 30px;width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-name{font-size:3.2rem;font-weight:900;margin-bottom:6px;text-align:center;line-height:1.05}
.modal-meta{font-family:'Space Mono',monospace;font-size:.95rem;color:var(--t3);margin-bottom:18px;text-align:center}
.modal-meta .gp{color:var(--grn)}
/* 階梯提示 */
.tier-hint{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.tier-chip{background:var(--s1);border:2px solid var(--bd);border-radius:12px;padding:10px 16px;font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all .15s;color:var(--t2)}
.tier-chip:active,.tier-chip.active{background:var(--acc);border-color:var(--acc);color:#fff}
/* 快捷金額 chips */
.shortcut-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.sc-chip{background:var(--s1);border:2px solid var(--bd);border-radius:12px;padding:10px 20px;font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700;cursor:pointer;color:var(--t2)}
.sc-chip:active{background:var(--acc);border-color:var(--acc);color:#fff}
/* 顯示數值 */
.modal-display{background:var(--s1);border:2px solid var(--bd);border-radius:16px;padding:16px 20px;text-align:right;margin-bottom:12px;min-height:80px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.modal-display .prefix{font-family:'Space Mono',monospace;font-size:1.6rem;color:var(--t3)}
.modal-display .val{font-family:'Space Mono',monospace;font-size:3rem;font-weight:700;color:var(--t1);line-height:1}
.modal-display .val.empty-val{color:var(--t3)}
.modal-gp{font-family:'Space Mono',monospace;font-size:1.15rem;color:var(--grn);text-align:right;margin-bottom:16px;min-height:28px;font-weight:700}
/* 數字鍵盤 - 大 */
.numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;flex:1}
.np-btn{background:var(--s1);border:2px solid var(--bd);border-radius:14px;min-height:64px;font-size:1.8rem;font-weight:700;font-family:'Space Mono',monospace;cursor:pointer;color:var(--t1);transition:all .1s}
.np-btn:active{background:var(--bd);transform:scale(.95)}
.np-btn.dbl{font-size:1.5rem}
.np-btn.del{background:var(--s3);color:var(--t2);font-size:1.6rem}
.modal-btns{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.modal-cancel{background:var(--s1);border:2px solid var(--bd);color:var(--t2);border-radius:14px;height:64px;font-size:1.15rem;font-family:'Noto Sans TC',sans-serif;cursor:pointer;font-weight:700}
.modal-confirm{background:linear-gradient(135deg,var(--acc),var(--ora));color:#fff;border:none;border-radius:14px;height:64px;font-size:1.15rem;font-family:'Noto Sans TC',sans-serif;cursor:pointer;font-weight:900}
/* 結算 */
.settle-box{background:linear-gradient(135deg,#e8fdf3,#d4f7e8);border:1.5px solid rgba(0,200,150,.25);border-radius:16px;padding:22px;text-align:center;margin-bottom:14px}
.sb-l{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--grn);margin-bottom:6px;font-weight:900}
.sb-v{font-family:'Space Mono',monospace;font-size:2.6rem;font-weight:700;color:var(--grn);line-height:1}
.sb-v.neg{color:var(--red)}
.sb-m{font-family:'Space Mono',monospace;font-size:.9rem;color:var(--t2);margin-top:6px}
.stbl{background:var(--s1);border-radius:14px;overflow:hidden;margin-bottom:11px;border:1.5px solid var(--bd)}
.sr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);font-size:.84rem}
.sr:last-child{border-bottom:none}
.sr .lb{color:var(--t2)}.sr .vl{font-family:'Space Mono',monospace;font-weight:700}
.sr.tot{background:var(--s2);font-weight:700}.sr.tot .lb{color:var(--t1)}
.sitems{background:var(--s1);border-radius:14px;overflow:hidden;margin-bottom:11px;border:1.5px solid var(--bd)}
.sih{padding:9px 14px;display:grid;grid-template-columns:1fr 72px 72px;gap:5px;border-bottom:1px solid var(--bd);background:var(--s2)}
.sih span{font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-weight:700}
.sih span.r{text-align:right}
.srow{padding:11px 14px;display:grid;grid-template-columns:1fr 72px 72px;gap:5px;border-bottom:1px solid var(--bd);align-items:center}
.srow:last-child{border-bottom:none}
.srow .nm{font-size:.84rem;font-weight:600}
.srow .mn{font-family:'Space Mono',monospace;font-size:.79rem;text-align:right;font-weight:700}
.srow .mn.gp{color:var(--grn)}.srow .mn.z{color:var(--t3)}
/* 歷史 */
.hist-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
.hs{background:var(--s1);border-radius:12px;padding:12px 13px;border:1.5px solid var(--bd)}
.hs-l{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:4px;font-weight:700}
.hs-v{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700}
.hs-v.g{color:var(--grn)}
.hday{background:var(--s1);border-radius:14px;margin-bottom:8px;overflow:hidden;cursor:pointer;border:1.5px solid var(--bd)}
.hday-hd{display:flex;align-items:center;gap:10px;padding:13px 14px}
.hday-date{font-family:'Space Mono',monospace;font-size:.78rem;font-weight:700;flex:1;color:var(--t1)}
.hday-rev{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--t2)}
.hday-net{font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700}
.hday-net.g{color:var(--grn)}.hday-net.r{color:var(--red)}
.hday-arrow{font-size:.7rem;color:var(--t3);transition:transform .2s}
.hday.open .hday-arrow{transform:rotate(180deg)}
.hday-body{display:none;border-top:1.5px solid var(--bd);padding:10px 14px;background:var(--s2)}
.hday.open .hday-body{display:block}
.hday-txrow{display:flex;justify-content:space-between;font-size:.76rem;padding:4px 0;border-bottom:1px solid var(--bd)}
.hday-txrow:last-child{border-bottom:none}
.hday-txrow .ti{color:var(--t2);flex:1}
.hday-txrow .tv{font-family:'Space Mono',monospace;font-weight:700}
.no-hist{background:var(--s1);border:1.5px dashed var(--bd2);border-radius:12px;padding:30px;text-align:center;color:var(--t3);font-size:.8rem}
.copy-btn{background:rgba(124,92,252,.1);border:1.5px solid rgba(124,92,252,.25);color:var(--pur);border-radius:10px;height:38px;font-size:.78rem;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer;flex:1}
.copy-btn:active{background:var(--pur);color:#fff}
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 12px 8px;font-size:.65rem;color:var(--t3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0}
.sync-dot.ok{background:var(--grn)}
.sync-dot.err{background:var(--red)}
.sync-dot.ing{background:var(--ora);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* 設定品項：字放大 */
.icard .icard-top input{font-size:1.2rem;height:48px;font-weight:700}
.icard .fl{font-size:.85rem;letter-spacing:.04em;min-height:26px;margin-bottom:6px;color:var(--t2)}
.icard .pb{font-size:.88rem;padding:6px 12px}
.icard input[type=number],.icard input[type=text]{font-size:1.1rem;height:46px}
.icard .tier-u{font-size:1rem}
.icard .add-tier-btn{font-size:.92rem;height:40px}
.icard .tier-preview{font-size:.88rem;line-height:1.8}
.icard .sc-amt-tag{font-size:1rem;padding:5px 10px}
.icard .add-sc-btn{font-size:.95rem;height:36px}
.icard .rm-btn{width:36px;height:36px;font-size:1.1rem}
.icard .icard-fields{gap:12px}
/* 成本框內紅色 $ / % */
.unit-in{position:relative}
.unit-sym{position:absolute;top:50%;transform:translateY(-50%);color:var(--red);font-weight:900;font-size:1.25rem;font-family:'Space Mono',monospace;pointer-events:none}
.unit-in.dol .unit-sym{left:12px}
.unit-in.dol input{padding-left:32px;padding-right:48px}
.unit-in.pct .unit-sym{right:14px}
.unit-in.pct input{padding-right:40px}
.unit-per{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.95rem;font-weight:700;pointer-events:none}
/* 件數快速加一 */
.prow{position:relative}
.prow.has-edit{padding-top:26px}
.prow-edit{position:absolute;top:4px;right:4px;width:30px;height:28px;border-radius:8px;border:1.5px solid var(--acc);background:#fff;color:var(--acc);font-size:.95rem;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1}
.prow-edit:active{background:var(--acc);color:#fff}
.prow:active{transform:scale(.97)}
/* 收銀模式切換 */

<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const h=React.createElement;
const db=window._db;
const fmt=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString('zh-TW',{maximumFractionDigits:0});
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');};
const nowTime=()=>new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
let _uid=Date.now();
const uid=()=>String(++_uid);
const APP_VER='v0922-20';

// ═══ 售價組合（統一計價）═══
// 組合表 [{qty,price}]，例：1斤$80、2斤$150
//  · 剛好符合組合 → 組合價
//  · 介於兩組之間 → 依比例（越多越貴、不跳價）
//  · 少於最小組合 → 最小組合的單價
//  【件數】超過最大組合 → 最大組合價 + 多出的件數 × 優惠單價（逐件加）
//  【重量】整批用所在級距的單價：未滿2斤用1斤單價，2斤以上用2斤那組的單價（150÷2=75）
//  超量/優惠單價未填 → 最大組合的平均單價
//  · 件數模式沒設組合但有舊單價 → 視為 1單位＝舊單價
// ═══ 震動回饋 ═══
// Android：navigator.vibrate；iPhone（iOS 18+ Safari）：系統開關元件的觸覺回饋；不支援就略過
function haptic(kind){
  const pat=kind==='success'?[35]:kind==='error'?[40,60,40]:[12];
  try{if(navigator.vibrate&&navigator.vibrate(pat))return;}catch(e){}
  try{
    if(deviceInfo().standalone){
      // 桌面模式：常駐隱藏開關（不用 display:none），每次點一下
      let lb=document.getElementById('__hap');
      if(!lb){
        lb=document.createElement('label');lb.id='__hap';lb.setAttribute('aria-hidden','true');
        lb.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0.01;overflow:hidden;pointer-events:none;z-index:-1';
        const ip=document.createElement('input');ip.type='checkbox';ip.setAttribute('switch','');
        lb.appendChild(ip);document.body.appendChild(lb);
      }
      lb.click();
      if(kind==='success'||kind==='error')setTimeout(()=>lb.click(),90);
      return;
    }
    const lb=document.createElement('label');lb.setAttribute('aria-hidden','true');lb.style.display='none';
    const ip=document.createElement('input');ip.type='checkbox';ip.setAttribute('switch','');
    lb.appendChild(ip);document.head.appendChild(lb);lb.click();document.head.removeChild(lb);
  }catch(e){}
}
function deviceInfo(){
  const ua=navigator.userAgent||'';
  const m=ua.match(/OS (\d+)_(\d+)/);
  const ios=/iPhone|iPad|iPod/.test(ua);
  const standalone=window.navigator.standalone===true||!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  return{ios,iosVer:m?(m[1]+'.'+m[2]):'',standalone,vib:typeof navigator.vibrate==='function'};
}
function VibTest(){
  const [msg,setMsg]=useState('');
  const d=deviceInfo();
  const way=d.vib?'Android 震動':(d.ios?(parseFloat(d.iosVer)>=18?'iPhone 觸覺回饋':'iOS '+d.iosVer+' 不支援網頁震動'):'此裝置不支援');
  return h('div',{className:'vib-test'},
    h('button',{className:'vib-btn',onClick:()=>{haptic('success');setMsg('已送出震動 '+new Date().toLocaleTimeString('zh-TW'));}},'📳 測試震動'),
    h('div',{className:'vib-info'},APP_VER+'｜'+(d.ios?'iPhone iOS '+(d.iosVer||'?'):(d.vib?'Android':'其他裝置'))+'｜'+(d.standalone?'桌面模式':'瀏覽器')+'｜'+way),
    msg&&h('div',{className:'vib-info'},msg)
  );
}
const UNITS=['斤','包','把','顆'];
function unitOf(it){return ((it&&it.unit)||'').trim()||'斤';}
function getTiers(it){
  let t=(it.tiers||[]).map(x=>({qty:parseFloat(x.qty),price:parseFloat(x.price)})).filter(x=>x.qty>0&&x.price>=0);
  if(t.length===0&&it.priceMode==='unit'&&parseFloat(it.unitPrice)>0)t=[{qty:1,price:parseFloat(it.unitPrice)}];
  return t.sort((a,b)=>a.qty-b.qty);
}
function overUnitOf(it,t){
  const o=parseFloat(it.overUnit);if(o>0)return o;
  const last=t[t.length-1];return last?last.price/last.qty:0;
}
const r2=x=>Math.round(x*100)/100;
function priceForQty(it,qty){
  const t=getTiers(it);if(!t.length||!(qty>0))return 0;
  const first=t[0],last=t[t.length-1];
  const ex=t.find(x=>x.qty===qty);if(ex)return ex.price;
  if(isWeight(unitOf(it))){
    let rate;
    if(qty>last.qty)rate=last.price/last.qty;
    else if(qty<first.qty)rate=first.price/first.qty;
    else{const b=t.filter(x=>x.qty<=qty).pop();rate=b.price/b.qty;}
    return Math.round(qty*rate);
  }
  if(qty>last.qty)return Math.round(last.price+(qty-last.qty)*overUnitOf(it,t));
  if(qty<first.qty)return Math.round(qty*first.price/first.qty);
  for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1];
    if(qty>a.qty&&qty<b.qty)return Math.round(a.price+(b.price-a.price)*(qty-a.qty)/(b.qty-a.qty));}
  return 0;
}
function qtyForAmount(it,amt){
  const t=getTiers(it);if(!t.length||!(amt>0))return 0;
  const first=t[0],last=t[t.length-1];
  const ex=t.find(x=>x.price===amt);if(ex)return ex.qty;
  if(isWeight(unitOf(it))){
    let rate;
    if(amt>last.price)rate=last.price/last.qty;
    else if(amt<first.price)rate=first.price/first.qty;
    else{const b=t.filter(x=>x.price<=amt).pop();rate=b.price/b.qty;}
    return rate>0?r2(amt/rate):0;
  }
  if(amt>last.price){const u=overUnitOf(it,t);return u>0?r2(last.qty+(amt-last.price)/u):0;}
  if(amt<first.price)return first.price>0?r2(amt*first.qty/first.price):0;
  for(let i=0;i<t.length-1;i++){const a=t[i],b=t[i+1];
    if(amt>a.price&&amt<b.price)return r2(a.qty+(b.qty-a.qty)*(amt-a.price)/(b.price-a.price));}
  return 0;
}
const isWeight=u=>/斤|公斤|kg|兩|克|g|磅/i.test(u);
function overLabel(it,t){
  const u=unitOf(it);if(!t||!t.length)return '超過後每'+u;
  const m=t[t.length-1].qty;
  if(isWeight(u))return m+u+'以上每'+u;
  return Number.isInteger(m)?'第'+(m+1)+u+'起每'+u:'超過'+m+u+'的部分每'+u;
}
function overRate(it,t){
  if(isWeight(unitOf(it))){const l=t[t.length-1];return l?l.price/l.qty:0;}
  return overUnitOf(it,t);
}
function tierSummary(it){
  const t=getTiers(it);if(!t.length)return '未設售價';
  const u=unitOf(it);
  return t.map(x=>x.qty+u+'$'+x.price).join('・')+'・'+overLabel(it,t)+'$'+r2(overRate(it,t));
}
function calcGP(it,revenue,qty){
  const pv=parseFloat(it.profitValue)||0;
  if(it.profitMode==='margin')return revenue*pv/100;
  if(it.profitMode==='unitcost')return revenue-pv*(qty||0);
  if(it.priceMode==='unit')return revenue-pv*(qty||0);
  return revenue*(1-pv/100);
}
function profitLabel(it){
  const pv=it.profitValue||0,u=unitOf(it);
  if(it.profitMode==='margin')return '毛利率 '+pv+'%';
  if(it.profitMode==='unitcost'||it.priceMode==='unit')return '成本 $'+pv+'/'+u;
  return '成本 '+pv+'%';
}

async function fbSaveConfig(cfg){await db.collection('config').doc('current').set(cfg);}
async function fbLoadConfig(){const s=await db.collection('config').doc('current').get();return s.exists?s.data():null;}
async function fbSaveTodayTx(txs){await db.collection('days').doc(todayStr()).set({transactions:txs,updatedAt:Date.now()},{merge:true});}
async function fbLoadTodayTx(){const s=await db.collection('days').doc(todayStr()).get();return s.exists?(s.data().transactions||[]):[];}
async function fbSaveHistory(entry){await db.collection('history').doc(entry.date).set(entry);}
async function fbLoadHistory(){
  try{const s=await db.collection('history').get();return s.docs.map(d=>({...d.data(),_docId:d.id})).sort((a,b)=>(b.date||b._docId||'').localeCompare(a.date||a._docId||''));}
  catch(e){console.error(e);return[];}
}
function fbWatchConfig(cb){return db.collection('config').doc('current').onSnapshot(s=>{if(s.metadata&&s.metadata.hasPendingWrites)return;if(s.exists)cb(s.data());},e=>console.error(e));}
function fbWatchTodayTx(cb){return db.collection('days').doc(todayStr()).onSnapshot(s=>{if(s.exists)cb(s.data().transactions||[]);});}

function PillToggle({options,value,onChange}){
  return h('div',{className:'ptog'},options.map(o=>h('button',{key:o.v,className:'pb'+(value===o.v?' on':''),onClick:()=>onChange(o.v)},o.l)));
}
function SyncBar({status}){
  const map={ok:'已同步',ing:'同步中…',err:'同步失敗'};
  if(!status||status==='idle')return null;
  return h('div',{className:'sync-bar'},h('div',{className:'sync-dot '+status}),h('span',null,(map[status]||'')+'　'+APP_VER));
}

// 設定防呆：回傳錯誤訊息（空字串＝通過）
function itemErr(it){
  if(!(it.name||'').trim())return '請填品項名稱';
  const rows=(it.tiers||[]).filter(t=>String(t.qty||'').trim()!==''||String(t.price||'').trim()!=='');
  if(rows.some(t=>!(parseFloat(t.qty)>0)||!(parseFloat(t.price)>0)))return '售價組合的數量與售價都要填';
  const t=getTiers(it);
  if(it.priceMode==='unit'&&t.length===0)return '請填售價金額';
  if(it.priceMode==='amount'&&it.profitMode==='unitcost'&&t.length===0)return '用成本$/'+unitOf(it)+'要先填售價組合';
  if(String(it.profitValue||'').trim()===''||!(parseFloat(it.profitValue)>=0))return '請填成本或毛利率';
  return '';
}
function itemKind(it){return (it.priceMode==='unit'&&!isWeight(unitOf(it)))?'count':'weight';}
// 記錄人員統計：[{name,n,rev}]；沒有任何人員記錄時回傳 []
function staffStat(txs){
  txs=txs||[];
  if(!txs.some(t=>t.by))return[];
  const agg={};
  txs.forEach(t=>{const k=t.by||'未記錄';if(!agg[k])agg[k]={name:k,n:0,rev:0};agg[k].n++;agg[k].rev+=(t.lines||[]).reduce((a,l)=>a+(l.revenue||0),0);});
  return Object.values(agg).sort((a,b)=>b.rev-a.rev);
}
function staffText(ps){return ps.map(p=>p.name+' '+p.n+'筆 '+fmt(p.rev)).join('　');}

// rep={title,sub,kpis:[{l,v,c}],note,rows:[{name,rev,gp}],people:[{name,n,rev}],daily:[{d,rev,net}]}
async function drawReport(rep){
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(e){}
  const W=1080,P=56,F="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif",M="'Space Mono',Menlo,monospace";
  const rows=rep.rows||[],daily=rep.daily||[],people=rep.people||[];
  const RH=78,DH=64;
  let H=300+250+(rep.note?70:0)+(rows.length?110+rows.length*RH:0)+(people.length?110+people.length*RH:0)+(daily.length?110+daily.length*DH:0)+110;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const rr=(X,Y,w,hh,r,fill,stroke)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+hh,r);x.arcTo(X+w,Y+hh,X,Y+hh,r);x.arcTo(X,Y+hh,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();if(fill){x.fillStyle=fill;x.fill();}if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke();}};
  const txt=(t,X,Y,font,col,align)=>{x.font=font;x.fillStyle=col;x.textAlign=align||'left';x.textBaseline='middle';x.fillText(t,X,Y);};
  // 背景
  x.fillStyle='#f0eee8';x.fillRect(0,0,W,H);
  // 頁首
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#ff4d6d');g.addColorStop(1,'#ff8c42');
  x.fillStyle=g;x.fillRect(0,0,W,260);
  txt(rep.title,P,100,'900 64px '+F,'#fff');
  txt(rep.sub,P,180,'700 40px '+M,'rgba(255,255,255,.92)');
  let y=300;
  // KPI
  const k=rep.kpis,kw=(W-P*2-24*(k.length-1))/k.length;
  k.forEach((it,i)=>{
    const X=P+i*(kw+24);
    rr(X,y,kw,210,28,'#fff','#e0ddd6');
    txt(it.l,X+30,y+52,'700 32px '+F,'#a8a49c');
    let fs=60;x.font='700 '+fs+'px '+M;while(x.measureText(it.v).width>kw-60&&fs>30){fs-=4;x.font='700 '+fs+'px '+M;}
    txt(it.v,X+30,y+128,'700 '+fs+'px '+M,it.c||'#1a1814');
    if(it.s)txt(it.s,X+30,y+180,'700 28px '+F,'#6b6860');
  });
  y+=250;
  if(rep.note){txt(rep.note,P,y+20,'700 32px '+F,'#6b6860');y+=70;}
  // 品項
  if(rows.length){
    txt('品項統計',P,y+30,'900 38px '+F,'#1a1814');
    txt('營業額',W-P-260,y+30,'700 28px '+F,'#a8a49c','right');
    txt('毛利',W-P,y+30,'700 28px '+F,'#a8a49c','right');
    y+=70;
    const mx=Math.max(...rows.map(r=>r.rev),1);
    rr(P,y,W-P*2,rows.length*RH+20,28,'#fff','#e0ddd6');
    y+=10;
    rows.forEach((r,i)=>{
      const cy=y+RH/2;
      const bw=(W-P-470-(P+20))*(r.rev/mx);
      rr(P+20,y+8,Math.max(bw,8),RH-16,14,r.kind==='count'?'#ffe2c8':'#ffdde8');
      let nm=r.name;x.font='900 38px '+F;while(x.measureText(nm).width>W-P*2-480&&nm.length>1)nm=nm.slice(0,-1);
      txt(nm,P+40,cy,'900 38px '+F,'#1a1814');
      txt(fmt(r.rev),W-P-260,cy,'700 36px '+M,'#1a1814','right');
      txt(fmt(r.gp),W-P-30,cy,'700 36px '+M,r.gp>=0?'#00a07a':'#e0304f','right');
      y+=RH;
    });
    y+=40;
  }
  // 人員
  if(people.length){
    txt('記錄人員',P,y+30,'900 38px '+F,'#1a1814');
    txt('筆數',W-P-260,y+30,'700 28px '+F,'#a8a49c','right');
    txt('營業額',W-P,y+30,'700 28px '+F,'#a8a49c','right');
    y+=70;
    const mx=Math.max(...people.map(r=>r.rev),1);
    rr(P,y,W-P*2,people.length*RH+20,28,'#fff','#e0ddd6');
    y+=10;
    people.forEach(r=>{
      const cy=y+RH/2;
      rr(P+20,y+8,Math.max((W-P-470-(P+20))*(r.rev/mx),8),RH-16,14,'#e6defe');
      let nm=r.name;x.font='900 38px '+F;while(x.measureText(nm).width>W-P*2-480&&nm.length>1)nm=nm.slice(0,-1);
      txt(nm,P+40,cy,'900 38px '+F,'#1a1814');
      txt(r.n+' 筆',W-P-260,cy,'700 36px '+M,'#6b6860','right');
      txt(fmt(r.rev),W-P-30,cy,'700 36px '+M,'#1a1814','right');
      y+=RH;
    });
    y+=40;
  }
  // 每日
  if(daily.length){
    txt('每日營業額',P,y+30,'900 38px '+F,'#1a1814');
    txt('營業額',W-P-260,y+30,'700 28px '+F,'#a8a49c','right');
    txt('淨利',W-P,y+30,'700 28px '+F,'#a8a49c','right');
    y+=70;
    const mx=Math.max(...daily.map(d=>d.rev),1);
    rr(P,y,W-P*2,daily.length*DH+20,28,'#fff','#e0ddd6');
    y+=10;
    daily.forEach(d=>{
      const cy=y+DH/2,bx=P+170,bmax=W-P-460-bx;
      txt(d.d.slice(5),P+30,cy,'700 32px '+M,'#6b6860');
      rr(bx,y+16,Math.max(bmax*(d.rev/mx),6),DH-32,10,'#ffb3c6');
      txt(fmt(d.rev),W-P-260,cy,'700 32px '+M,'#1a1814','right');
      txt(fmt(d.net),W-P-30,cy,'700 32px '+M,d.net>=0?'#00a07a':'#e0304f','right');
      y+=DH;
    });
    y+=40;
  }
  txt('收銀記帳　'+new Date().toLocaleString('zh-TW',{hour12:false}),W/2,H-50,'500 26px '+F,'#a8a49c','center');
  return c;
}
let __setImg=null;
async function showReportImage(rep,fname){
  const c=await drawReport(rep);

}
function ImageViewer(){
  const [img,setImg]=useState(null);
  useEffect(()=>{__setImg=setImg;return()=>{__setImg=null};},[]);
  if(!img)return null;
  const file=img.blob?new File([img.blob],img.name,{type:'image/png'}):null;
  const canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  return h('div',{className:'img-ov'},
    h('div',{className:'img-tip'},'iPhone：長按圖片 →「加入照片」或「分享」'),
    h('img',{src:img.url,className:'img-pv',alt:img.name}),
    h('div',{className:'img-btns'},
      canShare&&h('button',{className:'img-b share',onClick:async()=>{try{await navigator.share({files:[file],title:img.name});}catch(e){}}},'📤 分享（LINE）'),
      h('a',{className:'img-b dl',href:img.url,download:img.name},'⬇ 下載'),
      h('button',{className:'img-b close',onClick:()=>setImg(null)},'關閉')

}

function PageSetup({config,setConfig,goNext,syncStatus}){
  const {fixedCosts,items}=config;

  const [openItem,setOpenItem]=useState({});

  const staff=config.staff||[];

  const addStaff=()=>{
    const n=newStaff.trim();if(!n)return;
    if(staff.includes(n)){alert('「'+n+'」已經有了');return;}
    setConfig(c=>({...c,staff:[...(c.staff||[]),n]}));setNewStaff('');
  };
  const rmStaff=n=>{if(window.confirm('刪除記錄人員「'+n+'」？（已記錄的交易不受影響）'))setConfig(c=>({...c,staff:(c.staff||[]).filter(x=>x!==n)}));};
  const [flashId,setFlashId]=useState(null);
  const jumpTo=id=>{

    setTimeout(()=>{const el=document.getElementById('ic-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);
    setTimeout(()=>setFlashId(f=>f===id?null:f),1400);
  };
  const dragRef=useRef(null);
  useEffect(()=>{fbLoadHistory().then(h=>setPastConfigs(h.slice(0,5)));},[]);

  const setFixed=(id,f,v)=>setConfig(c=>({...c,fixedCosts:c.fixedCosts.map(r=>r.id===id?{...r,[f]:v}:r)}));
  const addFixed=()=>setConfig(c=>({...c,fixedCosts:[...c.fixedCosts,{id:uid(),name:'',amount:''}]}));
  const rmFixed=id=>setConfig(c=>({...c,fixedCosts:c.fixedCosts.filter(r=>r.id!==id)}));

  const setItem=(id,f,v)=>setConfig(c=>({...c,items:c.items.map(it=>it.id===id?{...it,[f]:v}:it)}));
  const setPM=(id,m)=>setConfig(c=>({...c,items:c.items.map(it=>it.id===id?{...it,priceMode:m}:it)}));
  const setProM=(id,m)=>setConfig(c=>({...c,items:c.items.map(it=>it.id===id?{...it,profitMode:m}:it)}));
  const addItem=()=>{
    const nid=uid();
    setOpenItem(o=>({...o,[nid]:true}));
    setConfig(c=>({...c,items:[...c.items,{id:nid,name:'',unit:'斤',priceMode:'unit',unitPrice:'',profitMode:'margin',profitValue:'',tiers:[{id:uid(),qty:'1',price:''}],overUnit:'',shortcuts:[]}]}));

  // 上移/下移
  const moveItem=(id,dir)=>{
    setConfig(c=>{
      const arr=[...c.items];
      const i=arr.findIndex(x=>x.id===id);
      const j=i+dir;
      if(i<0||j<0||j>=arr.length)return c;
      [arr[i],arr[j]]=[arr[j],arr[i]];

  const onDrop=(e,targetId)=>{
    e.preventDefault();e.currentTarget.classList.remove('drag-over');
    const fromId=dragRef.current;if(!fromId||fromId===targetId)return;
    setConfig(c=>{const arr=[...c.items];const fi=arr.findIndex(i=>i.id===fromId);const ti=arr.findIndex(i=>i.id===targetId);if(fi<0||ti<0)return c;[arr[fi],arr[ti]]=[arr[ti],arr[fi]];return{...c,items:arr};});

        h('div',{className:'staff-add'},

      )

        h('span',{className:'fixed-sum'},fmt(fixedCosts.reduce((a,r)=>a+(parseFloat(r.amount)||0),0))),
        h('span',{className:'fixed-arrow'+(showFixed?' open':'')},'▼')
      ),
      showFixed&&h('div',{style:{marginTop:12}},
        fixedCosts.map(r=>h('div',{key:r.id,className:'frow'},
          h('input',{type:'text',placeholder:'費用名稱',value:r.name,onChange:e=>setFixed(r.id,'name',e.target.value)}),
          h('input',{type:'number',placeholder:'$0',value:r.amount,min:0,onChange:e=>setFixed(r.id,'amount',e.target.value)}),
          h('button',{className:'rm-btn',onClick:()=>rmFixed(r.id)},'×')
        )),
        h('button',{className:'add-row-btn',onClick:addFixed},'＋ 新增費用')
      )
    ),
    pastConfigs.length>0&&h('div',null,
      h('div',{className:'sec',style:{marginTop:20}},'載入過去設定'),
      h('div',{className:'saved-configs'},pastConfigs.map(d=>h('div',{key:d.date||d._docId,className:'sc-row',onClick:()=>loadConfig(d)},
        h('div',{className:'sc-date'},d.date||d._docId),
        h('div',{className:'sc-info'},(d.items||[]).length+' 個品項'),

      )))

    h(VibTest,null)
  );

// ═══ PAGE 2 收銀 ═══
function PageCashier({config,setConfig,transactions,setTransactions,syncStatus,me,askMe}){
  const {items}=config;
  const [cart,setCart]=useState({});
  const [modal,setModal]=useState(null);
  const [numStr,setNumStr]=useState(''); // 數字鍵盤輸入
  const [dragMode,setDragMode]=useState(false);
  const [fast,setFastRaw]=useState(()=>{try{return localStorage.getItem('pos_fast')==='1';}catch(e){return false;}});
  const setFast=v=>{setFastRaw(v);try{localStorage.setItem('pos_fast',v?'1':'0');}catch(e){}};
  const [toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  // 記錄人員：一進 App 就強制選（App 層的 StaffGate）
  const needMe=()=>{if(me)return false;haptic('error');askMe();return true;};
  const txRef=useRef(transactions);
  txRef.current=transactions;
  const pickerRef=useRef(null);

  const sortedItems=items;
  const getCart=id=>cart[id]||{selected:false,qty:1,amount:''};
  const updCart=(id,p)=>setCart(c=>({...c,[id]:{...getCart(id),...p}}));

  const totals=()=>{
    let rev=0,gp=0;
    transactions.forEach(tx=>tx.lines.forEach(l=>{
      const it=items.find(i=>i.id===l.itemId);if(!it)return;
      const itU={...it,profitValue:parseFloat(it.profitValue)||0};
      rev+=l.revenue||0;gp+=calcGP(itU,l.revenue||0,l.qty||0);
    }));
    return{rev,gp};
  };
  const subtotal=items.reduce((s,it)=>{
    const st=getCart(it.id);if(!st.selected)return s;
    if(it.priceMode==='unit'){
      const qty=st.qty||1;
      const rev=priceForQty(it,qty);
      return s+rev;
    }
    return s+(parseFloat(st.amount)||0);
  },0);

  // 數字鍵盤
  const numPad=(key)=>{
    if(key==='del'){setNumStr(s=>s.slice(0,-1));return;}
    if(key==='00'){setNumStr(s=>(s==='0'||s==='')?s:s+'00');return;}
    if(key==='.'){setNumStr(s=>s.includes('.')?s:(s===''?'0.':s+'.'));return;}
    if(numStr.includes('.')&&numStr.split('.')[1].length>=2)return;
    if(numStr==='0'&&key!=='.'){setNumStr(key);return;}
    setNumStr(s=>s+key);
  };

  const openModal=it=>{
    const st=getCart(it.id);
    setModal(it);
    setNumStr(it.priceMode==='unit'?String(st.qty||1):String(st.amount||''));
  };
  const isQuick=it=>it.priceMode==='unit'&&!isWeight(unitOf(it));
  const tapAdd=it=>{
    const st=getCart(it.id);
    updCart(it.id,{selected:true,qty:st.selected?(parseFloat(st.qty)||0)+1:1});
  };
  const closeModal=()=>{setModal(null);setNumStr('');setTimeout(()=>{window.scrollTo({top:0,behavior:'smooth'});},50);};

  const confirmModal=(override)=>{
    if(!modal)return;
    const val=parseFloat(typeof override==='string'?override:numStr)||0;
    if(fast){if(val>0)recordSingle(modal,val);closeModal();return;}
    if(!(val>0)){updCart(modal.id,{selected:false,qty:1,amount:''});closeModal();return;}
    if(modal.priceMode==='unit'){
      updCart(modal.id,{selected:true,qty:val});
    } else {
      updCart(modal.id,{selected:true,amount:String(val)});
    }
    closeModal();
  };

  // 計算當前modal的毛利預覽
  const modalRevGP=()=>{
    if(!modal)return{rev:0,gp:0,qty:0};
    const itU={...modal,profitValue:parseFloat(modal.profitValue)||0};
    const val=parseFloat(numStr)||0;
    if(modal.priceMode==='unit'){
      const qty=val;
      const rev=priceForQty(modal,qty);
      return{rev,gp:calcGP(itU,rev,qty),qty};
    }
    // 金額模式：反推斤數
    const qty=qtyForAmount(modal,val);
    return{rev:val,gp:calcGP(itU,val,qty),qty};
  };

  const commit=()=>{
    const lines=[];
    items.forEach(it=>{
      const st=getCart(it.id);if(!st.selected)return;
      if(it.priceMode==='unit'){
        const qty=st.qty||1;
        const rev=priceForQty(it,qty);
        lines.push({itemId:it.id,qty,amount:null,revenue:rev});
      } else {
        const rev=parseFloat(st.amount)||0;
        const qty=qtyForAmount(it,rev);
        lines.push({itemId:it.id,qty,amount:rev,revenue:rev});
      }
    });
    if(!lines.length){haptic('error');alert('請先選擇品項');return;}
    if(needMe())return;
    const tx={id:uid(),lines,time:nowTime()};if(me)tx.by=me;
    setTransactions([...transactions,tx]);
    haptic('success');
    setCart({});
  };

  const delTx=id=>setTransactions(transactions.filter(t=>t.id!==id));
  const recordSingle=(it,val)=>{
    if(needMe())return;
    let line;
    if(it.priceMode==='unit'){line={itemId:it.id,qty:val,amount:null,revenue:priceForQty(it,val)};}
    else{line={itemId:it.id,qty:qtyForAmount(it,val),amount:val,revenue:val};}
    const tx={id:uid(),lines:[line],time:nowTime()};if(me)tx.by=me;
    const next=[...txRef.current,tx];
    txRef.current=next;
    setTransactions(next);
    haptic('success');
    const txt=(it.name||'未命名')+' '+(it.priceMode==='unit'?val+unitOf(it)+' ':'')+fmt(line.revenue);
    setToast({txId:tx.id,text:txt});
    clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(null),4000);
  };
  const undoToast=()=>{
    if(!toast)return;
    const next=txRef.current.filter(t=>t.id!==toast.txId);
    txRef.current=next;
    setTransactions(next);
    setToast(null);
  };
  const {rev,gp}=totals();

  // 觸控拖曳排序（手機電腦通用，插入式）
  const [drag,setDrag]=useState(null);
  const dragState=useRef(null);
  const onPointerDown=(e,it)=>{
    haptic();
    e.preventDefault();
    if(e.currentTarget.setPointerCapture)e.currentTarget.setPointerCapture(e.pointerId);
    dragState.current={id:it.id,overId:null};
    setDrag({id:it.id,name:it.name||'未命名',x:e.clientX,y:e.clientY,overId:null});
  };
  const onPointerMove=e=>{
    if(!dragState.current)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const cell=el&&el.closest('[data-pid]');
    const overId=cell?cell.getAttribute('data-pid'):null;
    dragState.current.overId=overId;
    setDrag(d=>d?{...d,x:e.clientX,y:e.clientY,overId}:d);
  };
  const onPointerUp=()=>{
    const s=dragState.current;
    dragState.current=null;
    setDrag(null);
    if(!s||!s.overId||s.overId===s.id)return;
    haptic('success');
    setConfig(c=>{
      const arr=[...c.items];
      const fi=arr.findIndex(x=>x.id===s.id);
      const ti=arr.findIndex(x=>x.id===s.overId);
      if(fi<0||ti<0)return c;
      [arr[fi],arr[ti]]=[arr[ti],arr[fi]];
      return{...c,items:arr};
    });
  };
  const onPointerCancel=()=>{dragState.current=null;setDrag(null);};
  useEffect(()=>{
    const block=e=>{if(dragState.current)e.preventDefault();};
    document.addEventListener('touchmove',block,{passive:false});
    return()=>document.removeEventListener('touchmove',block);
  },[]);

  const txLine=(tx,i)=>{
    let txRev=0,txGp=0;const parts=[];
    tx.lines.forEach(l=>{
      const it=items.find(i=>i.id===l.itemId);if(!it)return;
      const itU={...it,profitValue:parseFloat(it.profitValue)||0};
      const r=l.revenue||0;
      txRev+=r;txGp+=calcGP(itU,r,l.qty||0);
      const label=it.priceMode==='unit'?(it.name||'未命名')+' '+l.qty+unitOf(it)+' '+fmt(r):(it.name||'未命名')+' '+fmt(r)+(l.qty>0?'(約'+l.qty+unitOf(it)+')':'');
      parts.push(label);
    });
    return h('div',{key:tx.id,className:'txcard'},
      h('div',{className:'txn'},'#'+(i+1)),
      h('div',{className:'txc'},
        h('div',{className:'txi'},parts.join('　')),
        h('div',{className:'txa'},h('span',{className:'txr'},fmt(txRev)),h('span',{className:'txg'},'毛利 '+fmt(txGp)),tx.by&&h('span',{className:'txby'},tx.by),h('span',{className:'txt2'},tx.time))
      ),
      h('button',{className:'tx-del',onClick:()=>delTx(tx.id)},'✕')
    );
  };

  const {rev:mRev,gp:mGP,qty:mQty}=modalRevGP();

  return h('div',{className:'pg on'},
    h(SyncBar,{status:syncStatus}),
    h('div',{className:'day-bar'},
      h('div',{className:'db'},h('div',{className:'db-l'},'今日營業額'),h('div',{className:'db-v'},fmt(rev))),
      h('div',{className:'db'},h('div',{className:'db-l'},'今日毛利'),h('div',{className:'db-v '+(gp>=0?'g':'r')},fmt(gp)))
    ),
    h('div',{className:'staff-bar'+(me?'':' need'),onClick:askMe},
      h('span',{className:'staff-l'},'👤 記錄人員'),
      h('span',{className:'staff-me'},me||'未選擇'),
      h('button',{className:'staff-switch'},'換人')),
    h('div',{className:'tx-box'},
      h('div',{className:'tx-hd'},
        h('span',{className:'tx-hd-l'},'新增交易'),
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('button',{
            onClick:()=>setDragMode(d=>!d),
            style:{background:dragMode?'var(--acc)':'var(--s2)',border:'1.5px solid '+(dragMode?'var(--acc)':'var(--bd)'),color:dragMode?'#fff':'var(--t3)',borderRadius:8,padding:'4px 10px',fontSize:'.7rem',fontWeight:700,fontFamily:"'Noto Sans TC',sans-serif",cursor:'pointer'}
          },dragMode?'✓ 排序中':'⇅ 排序'),
          (!fast||subtotal>0)&&h('span',{className:'tx-sub'},'小計 '+fmt(subtotal))
        )
      ),
      h('div',{className:'mode-sw'},
        h('button',{className:'mode-btn'+(!fast?' on':''),onClick:()=>setFast(false)},'🧺 一般'),
        h('button',{className:'mode-btn'+(fast?' on fast':''),onClick:()=>setFast(true)},'⚡ 快速（點一下記一筆）')
      ),
      (!fast||subtotal>0)&&h('button',{className:'done-btn',onClick:commit},'✓  完成交易'),
      h('div',{
        className:'picker',
        ref:pickerRef,
        style:{gridTemplateRows:'repeat('+Math.ceil(sortedItems.length/3)+',auto)'}
      },
        sortedItems.map((it,idx)=>{
          const st=getCart(it.id);
          let dispAmt='';
          if(st.selected){
            if(it.priceMode==='unit'){
              const qty=st.qty||1;
              const rev=priceForQty(it,qty);
              dispAmt=qty+unitOf(it)+' '+fmt(rev);
            } else {
              dispAmt=fmt(parseFloat(st.amount)||0);
            }
          }
          if(dragMode){
            const isSrc=drag&&drag.id===it.id;
            const isOver=drag&&drag.overId===it.id&&drag.id!==it.id;
            return h('div',{
              key:it.id,
              'data-pid':it.id,
              className:'prow sortmode '+itemKind(it)+(isSrc?' src':'')+(isOver?' over':''),
              onPointerDown:e=>onPointerDown(e,it),
              onPointerMove:onPointerMove,
              onPointerUp:onPointerUp,
              onPointerCancel:onPointerCancel
            },
              h('div',{style:{fontSize:'1rem',color:'var(--t3)',marginBottom:4}},'⣿'),
              h('div',{className:'pname',style:{fontSize:'.9rem'}},it.name||'未命名')
            );
          }
          const quick=isQuick(it);
          return h('div',{key:it.id,className:'prow '+itemKind(it)+(st.selected?' sel':'')+(quick&&st.selected?' has-edit':''),onClick:()=>quick?(fast?recordSingle(it,1):tapAdd(it)):openModal(it)},
            quick&&st.selected&&h('button',{className:'prow-edit',onClick:e=>{e.stopPropagation();openModal(it);}},'✎'),
            h('div',{className:'pname'},it.name||'未命名'),
            st.selected&&h('div',{className:'prow-amt'},dispAmt)
          );
        })
      )
    ),
    h('div',{className:'rec-hd'},h('span',{className:'rec-l'},'交易記錄'),h('span',{className:'rec-c'},transactions.length+' 筆')),
    transactions.length===0?h('div',{className:'empty'},'尚無交易記錄'):[...transactions].reverse().map((tx,ri)=>txLine(tx,transactions.length-ri-1)),

    // Modal
    drag&&h('div',{className:'drag-ghost',style:{left:drag.x,top:drag.y}},drag.name),
    toast&&h('div',{className:'toast'},
      h('span',null,'✓ 已記錄　'+toast.text),
      h('button',{className:'toast-undo',onClick:undoToast},'復原')
    ),
    modal&&h('div',{className:'modal-overlay'},
      h('div',{className:'modal'},
        h('div',{className:'modal-name'},modal.name||'未命名'),
        h('div',{className:'modal-meta'},
          modal.priceMode==='unit'?'輸入'+unitOf(modal)+'數':'輸入售出金額',
          '　',
          h('span',{className:'gp'},profitLabel(modal))
        ),

        // 階梯 chips（兩種模式都顯示）
        getTiers(modal).length>0&&h('div',{className:'tier-hint'},
          getTiers(modal).map((t,ti)=>{
            const isActive=modal.priceMode==='unit'?t.qty===parseFloat(numStr):t.price===parseFloat(numStr);
            return h('div',{
              key:ti,
              className:'tier-chip'+(isActive?' active':''),
              onClick:()=>confirmModal(modal.priceMode==='unit'?String(t.qty):String(t.price))
            },t.qty+unitOf(modal)+' $'+t.price);
          })
        ),
        getTiers(modal).length>0&&h('div',{style:{textAlign:'center',fontSize:'.85rem',color:'var(--t3)',marginTop:-8,marginBottom:12}},
          overLabel(modal,getTiers(modal))+' $'+r2(overRate(modal,getTiers(modal)))),

        // 金額模式：快捷金額
        modal.priceMode==='amount'&&modal.shortcuts&&modal.shortcuts.length>0&&h('div',{className:'shortcut-chips'},
          modal.shortcuts.map(s=>h('div',{key:s,className:'sc-chip',onClick:()=>confirmModal(String(s))},'$'+s))
        ),

        // 顯示目前輸入值
        h('div',{className:'modal-display'},
          modal.priceMode==='amount'&&h('span',{className:'prefix'},'$'),
          h('span',{className:'val'+(numStr?'':' empty-val')},numStr||'0'),
          modal.priceMode==='unit'&&h('span',{className:'prefix'},unitOf(modal))
        ),

        // 毛利預覽
        h('div',{className:'modal-gp'},
          numStr
            ?(modal.priceMode==='amount'&&mQty>0
                ?'約 '+mQty+' '+unitOf(modal)+'　毛利 '+fmt(mGP)
                :fmt(mRev)+'　毛利 '+fmt(mGP))
            :''
        ),

        // 數字鍵盤
        h('div',{className:'numpad'},
          ['7','8','9','4','5','6','1','2','3'].map(k=>h('button',{key:k,className:'np-btn',onClick:()=>numPad(k)},k)),
          modal.priceMode==='unit'&&isWeight(unitOf(modal))
            ?h('button',{className:'np-btn dbl',onClick:()=>numPad('.')},'.')
            :h('button',{className:'np-btn dbl',onClick:()=>numPad('00')},'00'),
          h('button',{className:'np-btn',onClick:()=>numPad('0')},'0'),
          h('button',{className:'np-btn del',onClick:()=>numPad('del')},'⌫')
        ),

        h('div',{className:'modal-btns'},
          h('button',{className:'modal-cancel',onClick:closeModal},'取消'),
          h('button',{className:'modal-confirm',onClick:()=>confirmModal()},'確認')
        )
      )
    )
  );
}

  return h('div',{className:'gate'},
    h('div',{className:'gate-t'},'👤 誰在收銀？'),

      staff.map(n=>h('button',{key:n,className:'gate-btn'+(n===last?' last':''),onClick:()=>onPick(n)},n,n===last&&h('span',{className:'gate-last'},'上次')))),
    h('div',{className:'gate-add'},
      h('input',{type:'text',placeholder:staff.length?'不在名單？輸入名字新增':'輸入名字',value:nm,maxLength:8,onChange:e=>setNm(e.target.value),onKeyDown:e=>{if(e.key==='Enter')add();}}),
      h('button',{onClick:add},'＋ 新增並開始'))
  );
}
// ═══ PAGE 3 結算 ═══
function PageSettle({config,transactions,onSave,syncStatus}){
  const {items,fixedCosts}=config;
  const [saved,setSaved]=useState(false);
  const [saving,setSaving]=useState(false);
  const [settleCopied,setSettleCopied]=useState(false);

  const calcAll=()=>{
    let rev=0,gp=0;const stat={};
    transactions.forEach(tx=>tx.lines.forEach(l=>{
      const it=items.find(i=>i.id===l.itemId);if(!it)return;
      const itU={...it,profitValue:parseFloat(it.profitValue)||0};
      const r=l.revenue||0;rev+=r;
      const igp=calcGP(itU,r,l.qty||0);gp+=igp;
      if(!stat[l.itemId])stat[l.itemId]={rev:0,gp:0};
      stat[l.itemId].rev+=r;stat[l.itemId].gp+=igp;
    }));
    const fixed=fixedCosts.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
    return{rev,gp,fixed,net:gp-fixed,stat};
  };
  const {rev,gp,fixed,net,stat}=calcAll();
  const margin=rev>0?(net/rev*100):0;
  const people=staffStat(transactions);

  const doCopy=()=>{
    const fl=fixedCosts.filter(r=>parseFloat(r.amount)>0);
    const lines=[todayStr(),'營業額 '+fmt(rev)+'　淨利 '+fmt(net)+'（'+margin.toFixed(0)+'%）'];
    if(fl.length>0)lines.push(fl.map(r=>(r.name||'費用')+' -'+fmt(parseFloat(r.amount)||0)).join('　'));
    const se=Object.entries(stat).filter(([,s])=>s.rev>0).map(([id,s])=>{const it=items.find(i=>i.id===id);return'· '+(it?it.name:'?')+'　'+fmt(s.rev);});
    if(se.length>0){lines.push('');se.forEach(l=>lines.push(l));}
    if(people.length>0){lines.push('');lines.push('👤 '+staffText(people));}
    const text=lines.join('\n');
    const done=()=>{setSettleCopied(true);setTimeout(()=>setSettleCopied(false),2000);};
    navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();});
  };

  const doSave=async()=>{
    setSaving(true);
    try{const entry={date:todayStr(),fixedCosts,items,transactions,rev,gp,net};await fbSaveHistory(entry);setSaved(true);await onSave();}
    catch(e){console.error(e);}
    setSaving(false);
  };

  return h('div',{className:'pg on'},
    h(SyncBar,{status:syncStatus}),
    h('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'.65rem',color:'var(--t3)',textAlign:'center',marginBottom:14}},todayStr()),
    h('div',{className:'settle-box'},h('div',{className:'sb-l'},'當日淨利'),h('div',{className:'sb-v '+(net<0?'neg':'')},fmt(net)),h('div',{className:'sb-m'},'淨利率 '+margin.toFixed(1)+'%')),
    h('div',{className:'stbl'},
      h('div',{className:'sr'},h('span',{className:'lb'},'營業額'),h('span',{className:'vl'},fmt(rev))),
      h('div',{className:'sr'},h('span',{className:'lb'},'毛利'),h('span',{className:'vl',style:{color:'var(--grn)'}},fmt(gp))),
      fixedCosts.filter(r=>parseFloat(r.amount)>0).map(r=>h('div',{key:r.id,className:'sr'},h('span',{className:'lb'},r.name||'固定費用'),h('span',{className:'vl',style:{color:'var(--red)'}},'-'+fmt(parseFloat(r.amount)||0)))),
      h('div',{className:'sr tot'},h('span',{className:'lb'},'淨利'),h('span',{className:'vl',style:{color:net>=0?'var(--grn)':'var(--red)'}},fmt(net)))
    ),
    h('div',{className:'sec'},'品項統計'),
    h('div',{className:'sitems'},
      h('div',{className:'sih'},h('span',null,'品項'),h('span',{className:'r'},'小計'),h('span',{className:'r'},'毛利')),
      items.map(it=>{const s=stat[it.id]||{rev:0,gp:0};return h('div',{key:it.id,className:'srow'},h('div',{className:'nm'},it.name||'未命名'),h('div',{className:'mn '+(s.rev===0?'z':'')},fmt(s.rev)),h('div',{className:'mn '+(s.gp>0?'gp':s.gp===0?'z':'')},fmt(s.gp)));})
    ),
    people.length>0&&h(StaffTable,{people}),
    saved
      ?h('div',{style:{textAlign:'center',color:'var(--grn)',fontSize:'.85rem',padding:'12px 0',fontWeight:700}},'✓ 已儲存至雲端')
      :h('button',{className:'btn-primary',onClick:doSave,disabled:saving},saving?'儲存中…':'儲存今日記錄 ☁'),
    h('div',{className:'rep-btns'},
      h('button',{className:'copy-btn',onClick:doCopy},settleCopied?'✓ 已複製':'📋 複製文字'),
      h('button',{className:'img-btn',onClick:()=>showReportImage({
        title:'今日結算',sub:todayStr()+'　共 '+transactions.length+' 筆',
        kpis:[{l:'營業額',v:fmt(rev)},{l:'毛利',v:fmt(gp),c:'#00a07a'},{l:'淨利',v:fmt(net),c:net>=0?'#00a07a':'#e0304f',s:'淨利率 '+margin.toFixed(1)+'%'}],
        note:fixedCosts.filter(r=>parseFloat(r.amount)>0).map(r=>(r.name||'費用')+' -'+fmt(parseFloat(r.amount)||0)).join('　'),
        rows:Object.entries(stat).filter(([,s])=>s.rev>0).map(([id,s])=>{const it=items.find(i=>i.id===id);return{name:it?it.name:'?',rev:s.rev,gp:s.gp,kind:it?itemKind(it):'weight'};}).sort((a,b)=>b.rev-a.rev),
        people
      },'結算_'+todayStr())},'🖼 存成圖片')
    )
  );
}

// ═══ PAGE 4 歷史 ═══
function PageHistory({active,histKey}){
  const [open,setOpen]=useState({});
  const [copied,setCopied]=useState(null);
  const [history,setHistory]=useState([]);
  const [loading,setLoading]=useState(true);
  const [from,setFrom]=useState('');
  const [to,setTo]=useState('');
  const [rangeCopied,setRangeCopied]=useState(false);
  useEffect(()=>{
    if(!active)return;
    setLoading(true);
    fbLoadHistory().then(list=>{setHistory(list);setLoading(false);}).catch(()=>setLoading(false));
  },[active,histKey]);
  if(!active)return null;

  const dkey=d=>d.date||d._docId||'';
  const view=history.filter(d=>{const k=dkey(d);return(!from||k>=from)&&(!to||k<=to);});
  const totalRev=view.reduce((s,d)=>s+(d.rev||0),0);
  const totalGp=view.reduce((s,d)=>s+(d.gp||0),0);
  const totalNet=view.reduce((s,d)=>s+(d.net||0),0);
  const rangeMargin=totalRev>0?(totalNet/totalRev*100):0;
  const pad=n=>String(n).padStart(2,'0');
  const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const setQuick=key=>{
    const now=new Date();
    if(key==='all'){setFrom('');setTo('');return;}
    if(key==='today'){const t=ds(now);setFrom(t);setTo(t);return;}
    if(key==='7d'){const a=new Date(now);a.setDate(a.getDate()-6);setFrom(ds(a));setTo(ds(now));return;}
    if(key==='month'){setFrom(ds(new Date(now.getFullYear(),now.getMonth(),1)));setTo(ds(now));return;}
    if(key==='last'){const a=new Date(now.getFullYear(),now.getMonth()-1,1),b=new Date(now.getFullYear(),now.getMonth(),0);setFrom(ds(a));setTo(ds(b));return;}
  };

  function calcStat(d){
    const stat={};
    (d.transactions||[]).forEach(tx=>tx.lines.forEach(l=>{
      const it=(d.items||[]).find(i=>i.id===l.itemId);if(!it)return;
      const itU={...it,profitValue:parseFloat(it.profitValue)||0};
      const r=l.revenue||0;
      const gp=calcGP(itU,r,l.qty||0);
      if(!stat[l.itemId])stat[l.itemId]={name:it.name||'?',rev:0,gp:0,kind:itemKind(it)};
      stat[l.itemId].rev+=r;stat[l.itemId].gp+=gp;
    }));
    return Object.values(stat).filter(s=>s.rev>0);
  }

  function rangeStat(){
    const agg={};
    view.forEach(d=>calcStat(d).forEach(s=>{
      if(!agg[s.name])agg[s.name]={name:s.name,rev:0,gp:0,kind:s.kind};
      agg[s.name].rev+=s.rev;agg[s.name].gp+=s.gp;
    }));
    return Object.values(agg).sort((a,b)=>b.rev-a.rev);
  }
  const rangePeople=()=>staffStat([].concat(...view.map(d=>d.transactions||[])));
  function copyRange(){
    const days=view.map(dkey).sort();
    const head=(from||to)?((from||days[0]||'')+' ~ '+(to||days[days.length-1]||'')):'全部記錄';
    const lines=[head+'（'+view.length+'天）',
      '營業額 '+fmt(totalRev)+'　毛利 '+fmt(totalGp)+'　淨利 '+fmt(totalNet)+'（'+rangeMargin.toFixed(0)+'%）',''];
    rangeStat().forEach(s=>lines.push(s.name+'　'+fmt(s.rev)+'　毛利 '+fmt(s.gp)));
    const rp=rangePeople();if(rp.length){lines.push('');lines.push('👤 '+staffText(rp));}
    lines.push('');
    view.slice().sort((a,b)=>dkey(a).localeCompare(dkey(b))).forEach(d=>lines.push(dkey(d)+'　'+fmt(d.rev||0)+'　淨利 '+fmt(d.net||0)));
    const text=lines.join('\n');
    const done=()=>{setRangeCopied(true);setTimeout(()=>setRangeCopied(false),2000);};
    navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();});
  }
  function buildCopy(d,mode){
    const margin=d.rev>0?(d.net/d.rev*100):0;
    const fl=(d.fixedCosts||[]).filter(r=>parseFloat(r.amount)>0);
    const se=calcStat(d);
    let lines=[d.date||d._docId,'營業額 '+fmt(d.rev||0)+'　淨利 '+fmt(d.net||0)+'（'+margin.toFixed(0)+'%）'];
    if(fl.length>0)lines.push(fl.map(r=>(r.name||'費用')+' -'+fmt(parseFloat(r.amount)||0)).join('　'));
    if(se.length>0){
      lines.push('');
      if(mode==='full')lines.push('── 品項明細 ──');
      se.forEach(s=>lines.push(s.name+'　'+fmt(s.rev)+'　毛利 '+fmt(s.gp)));
    }
    const dp=staffStat(d.transactions);
    if(dp.length){lines.push('');lines.push('👤 '+staffText(dp));}
    if(mode==='full'){
      const txs=d.transactions||[];
      if(txs.length>0){
        lines.push('');
        txs.forEach(tx=>{
          const parts=[];let txRev=0;
          tx.lines.forEach(l=>{const it=(d.items||[]).find(i=>i.id===l.itemId);if(!it)return;txRev+=l.revenue||0;parts.push(it.priceMode==='unit'?(it.name||'?')+' '+l.qty+unitOf(it):(it.name||'?')+(l.qty>0?' 約'+l.qty+unitOf(it):''));});
          lines.push((tx.time||'--:--')+(tx.by?' '+tx.by:'')+'  '+parts.join(' ')+'  '+fmt(txRev));
        });
      }
    }
    return lines.join('\n');
  }

  function copyDay(d,e,mode){
    e.stopPropagation();
    const dateKey=d.date||d._docId;
    const key=dateKey+'-'+mode;
    const text=buildCopy(d,mode);
    const done=()=>{setCopied(key);setTimeout(()=>setCopied(null),2000);};
    navigator.clipboard.writeText(text).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();});
  }

  if(loading)return h('div',{className:'pg on'},h('div',{className:'empty'},'載入中…'));
  return h('div',{className:'pg on'},
    h('div',{className:'sec'},'日期區間'),
    h('div',{className:'date-row'},
      h('input',{type:'date',value:from,max:to||undefined,onChange:e=>setFrom(e.target.value)}),
      h('span',{className:'date-sep'},'～'),
      h('input',{type:'date',value:to,min:from||undefined,onChange:e=>setTo(e.target.value)})
    ),
    h('div',{className:'quick-row'},
      [['today','今天'],['7d','近7天'],['month','本月'],['last','上月'],['all','全部']].map(([k,l])=>
        h('button',{key:k,className:'quick-btn',onClick:()=>setQuick(k)},l))
    ),
    h('div',{className:'hist-summary'},
      h('div',{className:'hs'},h('div',{className:'hs-l'},'天數'),h('div',{className:'hs-v'},view.length+'天')),
      h('div',{className:'hs'},h('div',{className:'hs-l'},'營業額'),h('div',{className:'hs-v'},fmt(totalRev))),
      h('div',{className:'hs'},h('div',{className:'hs-l'},'淨利'),h('div',{className:'hs-v '+(totalNet>=0?'g':'')},fmt(totalNet)))
    ),
    h('div',{className:'range-line'},'毛利 '+fmt(totalGp)+'　淨利率 '+rangeMargin.toFixed(1)+'%'),
    view.length>0&&h('div',null,
      h('div',{className:'sec',style:{marginTop:14}},'區間品項統計'),
      h('div',{className:'sitems'},
        h('div',{className:'sih'},h('span',null,'品項'),h('span',{className:'r'},'營業額'),h('span',{className:'r'},'毛利')),
        rangeStat().map(st=>h('div',{key:st.name,className:'srow'},
          h('div',{className:'nm'},st.name),
          h('div',{className:'mn'},fmt(st.rev)),
          h('div',{className:'mn gp'},fmt(st.gp))
        ))
      ),
      rangePeople().length>0&&h(StaffTable,{people:rangePeople(),title:'區間記錄人員'}),
      h('div',{className:'rep-btns'},
        h('button',{className:'copy-btn',onClick:copyRange},rangeCopied?'✓ 已複製':'📋 複製文字'),
        h('button',{className:'img-btn',onClick:()=>{
          const days=view.map(dkey).sort();
          const head=(from||to)?((from||days[0]||'')+' ~ '+(to||days[days.length-1]||'')):(days.length?days[0]+' ~ '+days[days.length-1]:'全部');
          showReportImage({
            title:'區間報表',sub:head+'　'+view.length+' 天',
            kpis:[{l:'營業額',v:fmt(totalRev)},{l:'毛利',v:fmt(totalGp),c:'#00a07a'},{l:'淨利',v:fmt(totalNet),c:totalNet>=0?'#00a07a':'#e0304f',s:'淨利率 '+rangeMargin.toFixed(1)+'%'}],
            rows:rangeStat(),
            people:rangePeople(),
            daily:view.slice().sort((a,b)=>dkey(a).localeCompare(dkey(b))).map(d=>({d:dkey(d),rev:d.rev||0,net:d.net||0}))
          },'區間_'+head.replace(/[ ~]+/g,'_'));
        }},'🖼 存成圖片')
      )
    ),
    h('div',{className:'sec',style:{marginTop:14}},'每日記錄'),
    view.length===0?h('div',{className:'no-hist'},history.length?'這個區間沒有記錄':'尚無記錄'):
    view.map(d=>{
      const dateKey=d.date||d._docId;
      const isOpen=open[dateKey];
      return h('div',{key:dateKey,className:'hday'+(isOpen?' open':'')},
        h('div',{className:'hday-hd',onClick:()=>setOpen(o=>({...o,[dateKey]:!o[dateKey]}))},
          h('div',{className:'hday-date'},dateKey),
          h('div',{className:'hday-rev'},fmt(d.rev||0)),
          h('div',{className:'hday-net '+(d.net>=0?'g':'r')},fmt(d.net||0)),
          h('span',{className:'hday-arrow'},'▼')
        ),
        isOpen&&h('div',{className:'hday-body'},
          h('div',{style:{display:'flex',gap:6,marginBottom:10}},
            h('button',{className:'copy-btn',onClick:e=>copyDay(d,e,'simple')},copied===dateKey+'-simple'?'✓':'📊 品項明細'),
            h('button',{className:'copy-btn',onClick:e=>copyDay(d,e,'full')},copied===dateKey+'-full'?'✓':'📋 完整報告'),
            h('button',{className:'img-btn',onClick:e=>{e.stopPropagation();
              const m=d.rev>0?(d.net/d.rev*100):0;
              showReportImage({
                title:'單日結算',sub:dateKey+'　共 '+(d.transactions||[]).length+' 筆',
                kpis:[{l:'營業額',v:fmt(d.rev||0)},{l:'毛利',v:fmt(d.gp||0),c:'#00a07a'},{l:'淨利',v:fmt(d.net||0),c:(d.net||0)>=0?'#00a07a':'#e0304f',s:'淨利率 '+m.toFixed(1)+'%'}],
                note:(d.fixedCosts||[]).filter(r=>parseFloat(r.amount)>0).map(r=>(r.name||'費用')+' -'+fmt(parseFloat(r.amount)||0)).join('　'),
                rows:calcStat(d).sort((a,b)=>b.rev-a.rev),
                people:staffStat(d.transactions)
              },'結算_'+dateKey);
            }},'🖼 圖片')
          ),
          staffStat(d.transactions).length>0&&h('div',{className:'hday-staff'},'👤 '+staffText(staffStat(d.transactions))),
          h('div',{className:'sec',style:{marginBottom:6}},'交易明細'),
          (d.transactions||[]).length===0
            ?h('div',{style:{fontSize:'.76rem',color:'var(--t3)'}},'無記錄')
            :(d.transactions||[]).map((tx,i)=>{
              const parts=[];let txRev=0;
              tx.lines.forEach(l=>{const it=(d.items||[]).find(i=>i.id===l.itemId);if(!it)return;txRev+=l.revenue||0;parts.push(it.priceMode==='unit'?(it.name||'?')+' '+l.qty+unitOf(it):(it.name||'?')+(l.qty>0?' 約'+l.qty+unitOf(it):''));});
              return h('div',{key:tx.id||i,className:'hday-txrow'},h('span',{className:'ti'},'#'+(i+1)+' ',tx.by&&h('span',{className:'by'},tx.by+'｜'),parts.join('、')),h('span',{className:'tv'},fmt(txRev)));
            })
        )
      );
    })
  );
}

// ═══ APP ═══
function App(){
  const defConfig={
    fixedCosts:[{id:uid(),name:'攤位費',amount:''}],
    staff:[],
    items:[{id:uid(),name:'',priceMode:'unit',unitPrice:'',profitMode:'margin',profitValue:'',tiers:[],shortcuts:[]}]
  };
  const [tab,setTab]=useState(0);
  const [config,setConfigRaw]=useState(defConfig);
  const [transactions,setTxRaw]=useState([]);
  const [syncStatus,setSyncStatus]=useState('ing');
  const [histKey,setHistKey]=useState(0);
  const [loaded,setLoaded]=useState(false);
  const [me,setMeRaw]=useState('');
  const [gate,setGate]=useState(true);
  const lastMe=(()=>{try{return localStorage.getItem('pos_staff')||'';}catch(e){return'';}})();
  const pickMe=n=>{setMeRaw(n);setGate(false);haptic('success');try{localStorage.setItem('pos_staff',n);}catch(e){}};
  // 離開超過 30 分鐘再回來，重新選人
  useEffect(()=>{
    let hid=0;
    const f=()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>30*60*1000)setGate(true);};
    document.addEventListener('visibilitychange',f);return()=>document.removeEventListener('visibilitychange',f);
  },[]);
  const saveTimer=useRef(null);
  const cfgRef=useRef(config);
  const pendingCfg=useRef(0);
  const normCfg=cfg=>({...cfg,staff:cfg.staff||[],fixedCosts:cfg.fixedCosts||[],items:(cfg.items||[]).map(it=>{
    const hasT=(it.tiers||[]).some(t=>parseFloat(t.qty)>0&&t.price!==''&&t.price!=null);
    if(it.priceMode==='unit'&&!hasT&&parseFloat(it.unitPrice)>0)
      return{...it,tiers:[{id:uid(),qty:'1',price:String(it.unitPrice)}]};
    return{...it,tiers:it.tiers||[],shortcuts:it.shortcuts||[]};
  })});

  useEffect(()=>{
    (async()=>{
      try{
        const [cfg,txs]=await Promise.all([fbLoadConfig(),fbLoadTodayTx()]);
        if(cfg){const n=normCfg(cfg);cfgRef.current=n;setConfigRaw(n);}
        if(txs.length)setTxRaw(txs);
        setSyncStatus('ok');setLoaded(true);
      }catch(e){console.error(e);setSyncStatus('err');}
    })();
  },[]);

  useEffect(()=>{const unsub=fbWatchTodayTx(txs=>setTxRaw(txs));return unsub;},[]);
  // 設定即時同步（別台手機新增人員/品項會自動出現；自己正在改時不覆蓋）
  useEffect(()=>{const unsub=fbWatchConfig(cfg=>{if(pendingCfg.current)return;const n=normCfg(cfg);cfgRef.current=n;setConfigRaw(n);});return unsub;},[]);

  const setConfig=v=>{
    const next=typeof v==='function'?v(cfgRef.current):v;
    cfgRef.current=next;
    setConfigRaw(next);
    clearTimeout(saveTimer.current);
    const ver=(pendingCfg.current=(pendingCfg.current||0)+1);
    setSyncStatus('ing');
    saveTimer.current=setTimeout(async()=>{try{await fbSaveConfig(cfgRef.current);setSyncStatus('ok');}catch{setSyncStatus('err');}setTimeout(()=>{if(pendingCfg.current===ver)pendingCfg.current=0;},800);},1500);
  };

  const setTransactions=async txs=>{
    setTxRaw(txs);setSyncStatus('ing');
    try{await fbSaveTodayTx(txs);setSyncStatus('ok');}catch{setSyncStatus('err');}
  };

  const onSave=async()=>{await fbSaveTodayTx([]);setTxRaw([]);setHistKey(k=>k+1);};

  const tabs=['設定','收銀','結算','歷史'];
  const staffList=config.staff||[];
  const meOk=!!me&&staffList.includes(me);
  const showGate=loaded&&(gate||!meOk);
  return h('div',null,
    showGate&&h(StaffGate,{staff:staffList,last:lastMe,onPick:pickMe,onAdd:n=>setConfig(c=>({...c,staff:[...(c.staff||[]).filter(x=>x!==n),n]}))}),
    h('div',{className:'nav'},tabs.map((t,i)=>h('button',{key:i,className:'ntab'+(tab===i?' on':''),onClick:()=>setTab(i)},h('span',{className:'sn'},'0'+(i+1)),t))),
    tab===0&&h(PageSetup,{config,setConfig,goNext:()=>setTab(1),syncStatus}),
    tab===1&&h(PageCashier,{config,setConfig,transactions,setTransactions,syncStatus,me:meOk?me:'',askMe:()=>setGate(true)}),
    tab===2&&h(PageSettle,{config,transactions,onSave,syncStatus}),
    h(PageHistory,{active:tab===3,histKey}),
    h(ImageViewer,null)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
document.addEventListener('click',e=>{
  const t=e.target;
  if(t&&t.closest&&t.closest('button,.prow,.item-chip,.tier-chip,.sc-chip,.icard-brief,.fixed-hd,.hday-hd,.sc-row'))haptic();
},true);
</script>
</body>
